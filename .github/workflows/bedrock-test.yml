name: Join test with real clients (uses the latest published ISO)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 imagemagick >/dev/null
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Client libs
        run: cd os/build/join && npm install --no-audit --no-fund 2>&1 | tail -3
      - name: Get ISO
        env: { GH_TOKEN: "${{ github.token }}" }
        run: mkdir -p out && gh release download latest-iso -p ButterOS.iso -D out && ls -la out
      - name: Probe valid versions
        run: |
          V=""; for m in 34 36 43 45 52 62 65; do for n in 1 0 2 3; do u=https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-1.26.$m.$n.zip; c=$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' -I $u); echo "$m.$n $c"; if [ "$c" = 200 ]; then V="$V,1.26.$m.$n"; break; fi; done; done; echo "VERS=${V#,}"; echo "VERS=${V#,}" >> $GITHUB_ENV
      - name: Test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules; sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm || true
          mkdir -p e2e; qemu-img create -f raw /tmp/target.img 6G; ONLY_NMTUI=1 timeout 1800 python3 os/build/e2e.py out/ButterOS.iso e2e 2>&1 | tee e2e.log || true
      - name: Publish
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          d=$(mktemp -d); cp -r e2e "$d/"; cp e2e.log "$d/"; cd "$d"; git init -q -b ci-bedrock; git config user.name ci; git config user.email ci@x
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"; git add -A; git commit -qm dual; git push -f origin ci-bedrock
