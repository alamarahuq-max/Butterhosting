name: Tests
on:
  push:
    paths: ["os/wifi-*", "os/butter-wifi", "os/tests/**", "hosting-api/**", "api/**", ".github/workflows/tests.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wifi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq dialog wpasupplicant >/dev/null
      - name: Wi-Fi password handling (special characters, Show/Hide)
        run: python3 os/tests/wifi-pass.py
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax
        run: for f in hosting-api/*.js api/*.js dashboard.js; do node --check $f; done
      - name: Failover scenario (primary + device + shared store, fake docker)
        run: cd hosting-api && node failover.test.js
      - name: Relay (Vercel function) routing
        run: cd hosting-api && node relay.test.js
      - name: Payout ledger test
        run: cd hosting-api && node payouts.test.js && node nodes.test.js
      - name: Live GitHub registry store
        env:
          REGISTRY_REPO: ${{ github.repository }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: cd hosting-api && node github-store.smoke.js
