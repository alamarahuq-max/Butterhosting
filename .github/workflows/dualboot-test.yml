name: Dual-boot test (uses the latest published ISO)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf grub-pc-bin grub-efi-amd64-bin ntfs-3g parted dosfstools imagemagick >/dev/null
      - name: Get ISO
        env: { GH_TOKEN: "${{ github.token }}" }
        run: mkdir -p out && gh release download latest-iso -p ButterOS.iso -D out && ls -la out
      - name: Test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules; sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm || true
          mkdir -p e2e; ONLY_DUALBOOT=1 timeout 1800 python3 os/build/e2e.py out/ButterOS.iso e2e 2>&1 | tee e2e.log || true
      - name: Publish
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          d=$(mktemp -d); cp -r e2e "$d/"; cp e2e.log "$d/"; cd "$d"; git init -q -b ci-dual; git config user.name ci; git config user.email ci@x
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"; git add -A; git commit -qm dual; git push -f origin ci-dual
