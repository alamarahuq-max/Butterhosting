name: Build ButterOS ISO
on:
  workflow_dispatch:
    inputs:
      alpine:
        description: "Alpine release (e.g. 3.22)"
        default: "3.22"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO inside an Alpine container
        run: |
          set -o pipefail
          mkdir -p out
          docker run --rm --privileged \
            -e ALPINE_BRANCH=${{ github.event.inputs.alpine || '3.22' }} \
            -e SRC=/src -e OUT=/work/out \
            -v "$PWD":/src:ro -v "$PWD/out":/work/out \
            alpine:${{ github.event.inputs.alpine || '3.22' }} sh /src/os/build/in-container.sh 2>&1 | tee build.log
      - name: Test boot in QEMU (BIOS and UEFI) and take screenshots
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf imagemagick >/dev/null
          mkdir -p shots
          [ -f out/ButterOS.iso ] || { echo "no ISO to test"; exit 0; }
          boot() { # name, extra qemu args
            name=$1; shift
            rm -f mon-$name
            qemu-system-x86_64 -m 2048 -cdrom out/ButterOS.iso -boot d -vga std -display none -monitor unix:mon-$name,server,nowait -netdev user,id=n -device e1000,netdev=n "$@" &
            pid=$!
            sleep 10; echo "screendump shots/$name-early.ppm" | nc -U -q1 mon-$name >/dev/null
            sleep 15; echo "screendump shots/$name-menu.ppm" | nc -U -q1 mon-$name >/dev/null
            echo "sendkey ret" | nc -U -q1 mon-$name >/dev/null
            sleep 60; echo "screendump shots/$name-booted.ppm" | nc -U -q1 mon-$name >/dev/null
            echo "sendkey ret" | nc -U -q1 mon-$name >/dev/null
            sleep 6; echo "screendump shots/$name-main.ppm" | nc -U -q1 mon-$name >/dev/null
            kill $pid 2>/dev/null || true
          }
          boot bios || true
          boot uefi -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd || true
          for f in shots/*.ppm; do [ -f "$f" ] && convert "$f" "${f%.ppm}.png" && rm "$f"; done
          ls -la shots
      - name: End-to-end test (boot, web page, real Java + Bedrock servers, installer)
        if: always()
        env:
          E2E_REGISTRY_TOKEN: ${{ github.token }}
          E2E_REGISTRY_REPO: ${{ github.repository }}
        run: |
          [ -f out/ButterOS.iso ] || { echo "no ISO"; exit 0; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no /dev/kvm (tests will be slow)"
          mkdir -p e2e && npm i --no-audit --no-fund playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 || echo "playwright install failed"
          sudo apt-get install -y -qq grub-pc-bin grub-efi-amd64-bin ntfs-3g parted dosfstools >/dev/null 2>&1 || echo 'dualboot tools install failed'
          sudo grub-mkimage -O x86_64-efi -p /EFI/ButterOS -o out/butter-grubx64.efi part_gpt fat ntfs search normal linux configfile echo && sudo cp os/dualboot/butter-dualboot-linux.sh os/dualboot/install-windows.ps1 out/ && ls -la out
          truncate -s 1536M /tmp/target.img
          (cd out && python3 -m http.server 8000 >/dev/null 2>&1 &)
          NODE_PATH=$PWD/node_modules timeout 5400 python3 os/build/e2e.py out/ButterOS.iso e2e 2>&1 | tee e2e.log || true
          cat e2e/results.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ButterOS
          path: |
            out/ButterOS.iso
            out/ButterOS.iso.sha256
            build.log
            shots/
            e2e/
            e2e.log
      - name: Publish release and screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "butter-ci"; git config --global user.email "ci@users.noreply.github.com"
          if [ -f out/ButterOS.iso ]; then
            gh release delete latest-iso -y --cleanup-tag 2>/dev/null || true
            gh release create latest-iso $(ls out/ButterOS.iso out/ButterOS.iso.sha256 out/butter-grubx64.efi out/butter-dualboot-linux.sh out/install-windows.ps1 2>/dev/null) --title "ButterOS ISO (latest build)" --notes "Built by GitHub Actions run ${{ github.run_id }}. Flash with balenaEtcher or Rufus (DD mode)."
          fi
          d=$(mktemp -d); cp -r shots "$d/" 2>/dev/null || true; cp -r e2e "$d/" 2>/dev/null || true; cp e2e.log "$d/" 2>/dev/null || true; cp build.log "$d/" 2>/dev/null || true; cp -r out/diag "$d/" 2>/dev/null || true
          cd "$d"; git init -q -b ci-shots; git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A; git commit -qm "build ${{ github.run_id }} screenshots"; git push -f origin ci-shots
