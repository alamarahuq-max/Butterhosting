name: Probe Alpine (wifi drivers)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - name: Collect
        run: |
          apk add --no-cache linux-lts linux-lts-dev git curl build-base bash >/dev/null 2>&1
          mkdir -p /o; K=$(ls /lib/modules | head -1); echo "kernel $K" > /o/ls.txt
          for R in https://github.com/aircrack-ng/rtl8188eus.git https://github.com/kelebek333/rtl8188eus.git https://github.com/lwfinger/rtl8188eu.git https://github.com/gglluukk/rtl8188eus.git; do
            N=$(echo $R | cut -d/ -f4-5 | tr / _ | sed 's/.git//'); echo "=== $R" >> /o/ls.txt
            rm -rf /tmp/d && git clone --depth 1 $R /tmp/d >> /o/ls.txt 2>&1 || { echo "clone failed" >> /o/ls.txt; continue; }
            ( cd /tmp/d && git log -1 --format='%h %ad' >> /o/ls.txt; make -j4 KVER=$K KSRC=/usr/src/linux-headers-$K > /tmp/b.log 2>&1; grep -E "error:|Error " /tmp/b.log | head -12 >> /o/ls.txt; ls -la *.ko >> /o/ls.txt 2>&1 && cp *.ko /o/$N.ko )
          done
          ls -la /o >> /o/ls.txt
      - name: Push
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cd /o; git config --global user.name ci; git config --global user.email ci@x; git init -q -b ci-probe; git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"; git add -A; git commit -qm probe; git push -f origin ci-probe
